{% extends 'master.html' %}
{% load crispy_forms_tags %}

{% block title %}Edit Project — {{ project.name }}{% endblock %}

{% block content %}
<style>
  .page-header {
    background: linear-gradient(135deg, #1a3c5e 0%, #2563a8 100%);
    color: white;
    border-radius: 12px;
    padding: 28px 32px;
    margin-bottom: 28px;
    box-shadow: 0 4px 20px rgba(37,99,168,0.18);
  }
  .page-header h3 { margin: 0; font-size: 1.4rem; font-weight: 700; }
  .page-header p  { margin: 6px 0 0; opacity: 0.8; font-size: 0.92rem; }

  .form-card {
    border: none;
    border-radius: 12px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.07);
    overflow: hidden;
    margin-bottom: 24px;
  }
  .form-card .card-header {
    background: linear-gradient(135deg, #1a3c5e, #2563a8);
    color: white;
    padding: 16px 24px;
    border: none;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .form-card .card-header h5 { margin: 0; font-weight: 700; font-size: 1rem; }
  .form-card .card-header .header-icon {
    width: 32px; height: 32px;
    background: rgba(255,255,255,0.15);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 1rem;
  }
  .form-card .card-body { padding: 28px; background: white; }

  /* Override crispy forms styling to match app */
  .form-card .form-label,
  .form-card label {
    font-size: 0.8rem !important;
    font-weight: 700 !important;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    color: #64748b !important;
    margin-bottom: 8px;
  }
  .form-card .form-control,
  .form-card .form-select {
    border-radius: 9px !important;
    border: 1.5px solid #e2e8f0 !important;
    font-size: 0.9rem !important;
    color: #334155 !important;
    padding: 10px 14px !important;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .form-card .form-control:focus,
  .form-card .form-select:focus {
    border-color: #2563a8 !important;
    box-shadow: 0 0 0 3px rgba(37,99,168,0.12) !important;
    outline: none;
  }
  .form-card textarea.form-control { resize: vertical; min-height: 90px; }
  .form-card .mb-3 { margin-bottom: 20px !important; }

  /* Buttons */
  .btn-submit {
    background: linear-gradient(135deg, #1a3c5e, #2563a8);
    color: white;
    border: none;
    border-radius: 9px;
    padding: 11px 32px;
    font-size: 0.92rem;
    font-weight: 700;
    transition: opacity 0.15s, transform 0.15s;
  }
  .btn-submit:hover { opacity: 0.88; transform: translateY(-1px); color: white; }
  .btn-cancel {
    border-radius: 9px;
    padding: 11px 24px;
    font-size: 0.9rem;
    font-weight: 600;
    border: 1.5px solid #e2e8f0;
    color: #64748b;
    background: white;
    transition: background 0.15s;
    text-decoration: none;
    display: inline-block;
  }
  .btn-cancel:hover { background: #f1f5f9; color: #334155; }
</style>

<div class="container-fluid px-4 mt-4">

  <!-- Page Header -->
  <div class="page-header">
    <h3>&#9998; Edit Project</h3>
    <p>{{ project.name }} &mdash; {{ project.school.name }}</p>
  </div>

  <div class="row justify-content-center">
    <div class="col-12 col-lg-8">

      <div class="card form-card">
        <div class="card-header">
          <div class="header-icon">&#128203;</div>
          <h5>Project Details</h5>
        </div>
        <div class="card-body">
          <form method="post">
            {% csrf_token %}
            {{ form|crispy }}
            <div class="d-flex gap-3 mt-4">
              <button type="submit" class="btn btn-submit">
                &#128190; Save Changes
              </button>
              <a href="{% url 'projects_list' %}" class="btn btn-cancel">
                Cancel
              </a>
            </div>
          </form>
        </div>
      </div>

    </div>
  </div>

</div>
{% endblock %}
